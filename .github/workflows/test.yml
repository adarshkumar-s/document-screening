name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Compile every Python file
        run: |
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 -n1 python -m py_compile
      - name: Verify frontend JavaScript syntax
        run: |
          node --check land-intelligence.js
          node --check js/app.js
          node --check js/admin-assistant.js
      - name: Build production Docker image
        run: docker build -t document-screening:test .
      - name: Verify actual ASGI import
        run: python -c "from main import app; print(app)"
      - name: Run tests
        run: pytest -q
      - name: Verify production-style startup
        env:
          APP_ENV: production
          JWT_SECRET: ci-test-only-random-secret
          ALLOWED_ORIGINS: http://127.0.0.1:8000
          ADMIN_ACTION_SECRET: ci-test-only-admin-secret
        run: |
          set -e
          uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          pid=$!
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/api/demo-land/health > /tmp/health.json; then
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/uvicorn.log
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/demo-land/health
          curl -fsS http://127.0.0.1:8000/api/demo-land/scenarios
          curl -fsS http://127.0.0.1:8000/land-intelligence > /tmp/land-intelligence.html
          grep -q "LAND INTELLIGENCE" /tmp/land-intelligence.html
          css_type=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8000/land-intelligence.css | tr -d '\r' | grep -i '^content-type:' | head -1)
          echo "$css_type" | grep -qi 'text/css'
          curl -fsS http://127.0.0.1:8000/land-intelligence.css > /tmp/land-intelligence.css
          ! grep -qi '<html' /tmp/land-intelligence.css
          js_type=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8000/land-intelligence.js | tr -d '\r' | grep -i '^content-type:' | head -1)
          echo "$js_type" | grep -qi 'javascript'
          curl -fsS http://127.0.0.1:8000/land-intelligence.js > /tmp/land-intelligence.js
          ! grep -qi '<html' /tmp/land-intelligence.js
          kill "$pid"
          wait "$pid" || true
