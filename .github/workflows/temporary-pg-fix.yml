name: temporary-pg-fix
on:
  push:
    branches: [arena/01a0d72f-document-screening-timeout-fix]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PostgreSQL assistant task migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assistant_tasks.py')
          s = p.read_text()
          old = '''        # Additive migration for registries created before the worker lease.\n        try:\n            columns = {row["name"] for row in db.execute("PRAGMA table_info(assistant_requests)").fetchall()}\n            if "run_id" not in columns:\n                db.execute("ALTER TABLE assistant_requests ADD COLUMN run_id TEXT")\n            if "heartbeat_at" not in columns:\n                db.execute("ALTER TABLE assistant_requests ADD COLUMN heartbeat_at REAL")\n        except Exception:\n            try:\n                db.execute("ALTER TABLE assistant_requests ADD COLUMN IF NOT EXISTS run_id TEXT")\n                db.execute("ALTER TABLE assistant_requests ADD COLUMN IF NOT EXISTS heartbeat_at REAL")\n            except Exception:\n                pass\n'''
          new = '''        # Additive migration for registries created before the worker lease.\n        # PRAGMA is SQLite-only. On PostgreSQL, a failed PRAGMA aborts the\n        # transaction, so inspect information_schema instead.\n        if getattr(db, "is_pg", False):\n            columns = {row["column_name"] for row in db.execute(\n                "SELECT column_name FROM information_schema.columns "\n                "WHERE table_schema=current_schema() AND table_name=%s",\n                ("assistant_requests",),\n            ).fetchall()}\n            if "run_id" not in columns:\n                db.execute("ALTER TABLE assistant_requests ADD COLUMN IF NOT EXISTS run_id TEXT")\n            if "heartbeat_at" not in columns:\n                db.execute("ALTER TABLE assistant_requests ADD COLUMN IF NOT EXISTS heartbeat_at DOUBLE PRECISION")\n        else:\n            columns = {row["name"] for row in db.execute("PRAGMA table_info(assistant_requests)").fetchall()}\n            if "run_id" not in columns:\n                db.execute("ALTER TABLE assistant_requests ADD COLUMN run_id TEXT")\n            if "heartbeat_at" not in columns:\n                db.execute("ALTER TABLE assistant_requests ADD COLUMN heartbeat_at REAL")\n'''
          if old not in s:
              raise SystemExit('expected migration block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '298482267+arena-ai-coding-agent[bot]@users.noreply.github.com'
          git add assistant_tasks.py
          git commit -m 'Fix PostgreSQL assistant task table initialization'
          git push origin HEAD
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '298482267+arena-ai-coding-agent[bot]@users.noreply.github.com'
          rm -f .github/workflows/temporary-pg-fix.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove temporary PostgreSQL fix workflow'
          git push origin HEAD || true
