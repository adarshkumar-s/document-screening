name: Apply PostgreSQL assistant task migration fix

on:
  push:
    branches: [fix/assistant-tasks-postgres-migration]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration fix and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("assistant_tasks.py")
          text = path.read_text()
          old = '''        # Additive migration for registries created before the worker lease.\n        try:\n            columns = {row["name"] for row in db.execute("PRAGMA table_info(assistant_requests)").fetchall()}\n            if "run_id" not in columns:\n                db.execute("ALTER TABLE assistant_requests ADD COLUMN run_id TEXT")\n            if "heartbeat_at" not in columns:\n                db.execute("ALTER TABLE assistant_requests ADD COLUMN heartbeat_at REAL")\n        except Exception:\n            try:\n                db.execute("ALTER TABLE assistant_requests ADD COLUMN IF NOT EXISTS run_id TEXT")\n                db.execute("ALTER TABLE assistant_requests ADD COLUMN IF NOT EXISTS heartbeat_at REAL")\n            except Exception:\n                pass\n'''
          new = '''        # Additive migration for registries created before the worker lease.\n        # The deployed database can be PostgreSQL; PRAGMA is SQLite-only and\n        # aborts the PostgreSQL transaction before the fallback can run.\n        if getattr(db, "is_pg", False):\n            columns = {\n                row["column_name"]\n                for row in db.execute(\n                    "SELECT column_name FROM information_schema.columns "\n                    "WHERE table_schema = current_schema() AND table_name=?",\n                    ("assistant_requests",),\n                ).fetchall()\n            }\n        else:\n            columns = {\n                row["name"]\n                for row in db.execute("PRAGMA table_info(assistant_requests)").fetchall()\n            }\n        if "run_id" not in columns:\n            db.execute("ALTER TABLE assistant_requests ADD COLUMN run_id TEXT")\n        if "heartbeat_at" not in columns:\n            db.execute("ALTER TABLE assistant_requests ADD COLUMN heartbeat_at REAL")\n'''
          if old not in text:
              raise SystemExit("expected migration block not found; refusing to modify the file")
          path.write_text(text.replace(old, new, 1))

          test = Path("tests/test_assistant_tasks_postgres_migration.py")
          test.write_text('''import assistant_tasks\n\n\nclass _Result:\n    def __init__(self, rows=(), rowcount=0):\n        self._rows = list(rows)\n        self.rowcount = rowcount\n\n    def fetchall(self):\n        return self._rows\n\n\nclass _FakeDB:\n    is_pg = True\n\n    def __init__(self):\n        self.queries = []\n\n    def __enter__(self):\n        return self\n\n    def __exit__(self, exc_type, exc, tb):\n        return False\n\n    def execute(self, query, params=()):\n        self.queries.append((query, params))\n        if "information_schema.columns" in query:\n            return _Result([\n                {"column_name": "request_id"},\n                {"column_name": "surface"},\n                {"column_name": "user_id"},\n                {"column_name": "kind"},\n                {"column_name": "payload"},\n                {"column_name": "payload_hash"},\n                {"column_name": "state"},\n                {"column_name": "attempts"},\n                {"column_name": "result"},\n                {"column_name": "error_code"},\n                {"column_name": "error_detail"},\n                {"column_name": "cancel_requested"},\n                {"column_name": "created_at"},\n                {"column_name": "updated_at"},\n                {"column_name": "started_at"},\n                {"column_name": "finished_at"},\n                {"column_name": "run_id"},\n                {"column_name": "heartbeat_at"},\n            ])\n        return _Result(rowcount=1)\n\n\ndef test_ensure_tasks_table_uses_postgres_metadata_not_pragma(monkeypatch):\n    fake = _FakeDB()\n    monkeypatch.setattr(assistant_tasks, "TASKS_TABLE_READY", False)\n    monkeypatch.setattr(assistant_tasks, "_get_db", lambda: fake)\n\n    assistant_tasks.ensure_tasks_table()\n\n    sql = "\\n".join(query for query, _ in fake.queries)\n    assert "information_schema.columns" in sql\n    assert "PRAGMA table_info" not in sql\n    assert "ALTER TABLE assistant_requests ADD COLUMN run_id TEXT" not in sql\n    assert "ALTER TABLE assistant_requests ADD COLUMN heartbeat_at REAL" not in sql\n''')
          PY

      - name: Run focused regression test
        run: |
          python -m compileall -q assistant_tasks.py tests/test_assistant_tasks_postgres_migration.py
          pytest -q tests/test_assistant_tasks_postgres_migration.py

      - name: Commit and push patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistant_tasks.py tests/test_assistant_tasks_postgres_migration.py
          git commit -m "fix: make assistant task migration PostgreSQL-safe"
          git push
