name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run tests
        run: pytest -q

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo 'No JavaScript files found; skipping.'
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      # gitleaks-action scans the pull request's commit range
      # (`<first PR commit>^..<last PR commit>`), so those objects must exist in
      # the checkout. The actions/checkout default is fetch-depth: 1, which
      # leaves only the head commit: `git log <first>^..<head>` then fails with
      # "unknown revision", gitleaks exits 1 (NOT 2, which would mean leaks
      # found) and the action fails with an unexpected exit code while having
      # scanned ~0 bytes. Fetch the full history so the real scan actually runs.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
