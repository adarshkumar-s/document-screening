name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run tests
        run: pytest -q

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo 'No JavaScript files found; skipping.'
          fi

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build --pull --tag document-screening:ci .

      - name: Start production container smoke test
        run: |
          docker run --detach --name document-screening-ci \
            --publish 18000:10000 \
            --env APP_ENV=development \
            document-screening:ci
          trap 'docker logs document-screening-ci || true; docker rm -f document-screening-ci || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/ >/dev/null; then
              echo 'Container is serving HTTP.'
              exit 0
            fi
            sleep 2
          done
          echo 'Container did not become ready.'
          docker logs document-screening-ci
          exit 1

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
