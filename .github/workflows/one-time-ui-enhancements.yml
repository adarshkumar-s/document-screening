name: One-time UI enhancements

on:
  push:
    branches: [arena/ui-land-records-dashboard]

permissions:
  contents: write

jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Apply enhancements
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          if 'vectorflow-logo-header' not in s:
            s=s.replace('<div class="gov-brand-container">\n      <div class="gov-titles">','<div class="gov-brand-container">\n      <img class="vectorflow-logo vectorflow-logo-header" src="/assets/vectorflow.png" alt="VectorFlow" onerror="this.style.display=\'none\'">\n      <div class="gov-titles">',1)
          if 'landIntelDashboardEnhancements' not in s:
            block='''          <div id="staffStatsRow"></div>\n          <section id="landIntelDashboardEnhancements" class="ui-enhancement-section"><div class="ui-section-heading"><div><div class="ui-eyebrow">LAND INTELLIGENCE</div><h3>Land Intelligence at a glance</h3><p>Review mutations, encumbrances, court cases and risk signals from the dashboard.</p></div><button type="button" class="btn saffron" id="openLandIntelDashboardBtn">Open Land Intelligence</button></div><div class="ui-intel-grid"><article class="ui-intel-card"><div class="ui-intel-icon">🗺️</div><div><h4>Land Records</h4><p>Search parcels and open the intelligence record.</p></div><button class="btn ghost ui-card-action" data-intel-action="records">View records</button></article><article class="ui-intel-card"><div class="ui-intel-icon">🔄</div><div><h4>Mutation &amp; Ownership</h4><p>Create or review ownership changes.</p></div><button class="btn ghost ui-card-action" data-intel-action="mutations">Create mutation</button></article><article class="ui-intel-card"><div class="ui-intel-icon">📜</div><div><h4>Encumbrances</h4><p>Check registered charges and restrictions.</p></div><button class="btn ghost ui-card-action" data-intel-action="encumbrances">Review charges</button></article><article class="ui-intel-card"><div class="ui-intel-icon">⚖️</div><div><h4>Court Cases</h4><p>See litigation linked to a parcel.</p></div><button class="btn ghost ui-card-action" data-intel-action="litigation">Review cases</button></article><article class="ui-intel-card"><div class="ui-intel-icon">🚩</div><div><h4>Risk Review</h4><p>Inspect review signals and evidence.</p></div><button class="btn ghost ui-card-action" data-intel-action="risk">Open risk review</button></article><article class="ui-intel-card"><div class="ui-intel-icon">📊</div><div><h4>Reports</h4><p>Generate land-intelligence summaries.</p></div><button class="btn ghost ui-card-action" data-intel-action="reports">Open reports</button></article></div><div id="landIntelDashboardSummary" class="ui-intel-summary">Land Intelligence shortcuts are ready.</div></section>'''
            s=s.replace('          <div id="staffStatsRow"></div>',block,1)
          old='''<div class="card-header">\n              <h3 class="card-title">All Records</h3>\n              <input type="text" id="staffSearchInput" placeholder="Search ID, Owner, Village, Type..." style="width:260px;padding:6px 10px;font-size:12px">\n            </div>'''
          new='''<div class="card-header ui-records-header"><div><h3 class="card-title">All Records</h3><div id="staffRecordsSummary" class="ui-records-summary">Search across ID, filename, owner, survey/khasra, village, district, type and status.</div></div><div class="ui-record-search"><input type="search" id="staffSearchInput" placeholder="Search records…" aria-label="Search all records" style="width:260px;padding:6px 10px;font-size:12px"><button type="button" class="btn ghost" id="staffSearchClear">Clear</button></div></div>'''
          if 'staffRecordsSummary' not in s:s=s.replace(old,new,1)
          if 'class="site-footer"' not in s:
            foot='''<footer class="site-footer"><div class="site-footer-inner"><div class="site-footer-brand"><img src="/assets/vectorflow.png" alt="VectorFlow" class="site-footer-logo"><div><strong>Digital Land Records Portal</strong><span>DILRMP · Land Intelligence</span></div></div><nav class="site-footer-links"><span>Land Intelligence</span><span>Data Management</span><span>Accessibility</span><span>Audit &amp; Security</span></nav><div class="site-footer-meta">© <span id="siteFooterYear"></span> VectorFlow · Land-records workflow</div></div></footer>\n\n'''
            s=s.replace('<!-- ADMINISTRATION PANEL: existing staff interfaces are mounted here once, not duplicated. -->',foot+'<!-- ADMINISTRATION PANEL: existing staff interfaces are mounted here once, not duplicated. -->',1)
          if 'css/ui-enhancements.css' not in s:s=s.replace('  <link rel="stylesheet" href="css/admin-assistant.css">','  <link rel="stylesheet" href="css/admin-assistant.css">\n  <link rel="stylesheet" href="css/ui-enhancements.css">',1)
          if 'js/ui-enhancements.js' not in s:s=s.replace('<script src="js/app.js?v=32"></script>','<script src="js/app.js?v=32"></script>\n<script src="js/ui-enhancements.js"></script>',1)
          p.write_text(s)
          Path('js/ui-enhancements.js').write_text("""(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],n=v=>String(v??'').trim().toLowerCase().replace(/\\s+/g,' '),txt=d=>{const f=d?.fields||{};return n([d?.id,d?.filename,d?.doc_type,d?.status,d?.uploaded_by,d?.mean_conf,...Object.values(f).map(x=>x?.value??x??'')].join(' '))};let wired=false;function wire(){const i=$('#staffSearchInput');if(!i||wired||typeof window.renderStaffRecords!=='function')return;wired=true;const a=()=>{const ds=Array.isArray(window.staffDocs)?window.staffDocs:[],q=n(i.value),f=q?ds.filter(d=>txt(d).includes(q)):ds;window.renderStaffRecords(f);const s=$('#staffRecordsSummary');if(s)s.textContent=q?`Showing ${f.length} of ${ds.length} records for “${i.value.trim()}”.`:`${ds.length} records loaded. Search across ID, filename, owner, survey/khasra, village, district, type and status.`};i.addEventListener('input',a);$('#staffSearchClear')?.addEventListener('click',()=>{i.value='';a();i.focus()})}function go(x){window.switchStaffTab?.('landintel');setTimeout(()=>$('#landIntelWorkspace')?.querySelector(`[data-sub=\"${x}\"]`)?.click(),80)}function init(){wire();$('#openLandIntelDashboardBtn')?.addEventListener('click',()=>go('records'));$$('[data-intel-action]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.intelAction)));const y=$('#siteFooterYear');if(y)y.textContent=new Date().getFullYear()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();new MutationObserver(wire).observe(document.body,{childList:true,subtree:true})})();""")
          Path('css/ui-enhancements.css').write_text('.vectorflow-logo-header{width:112px;max-height:48px;object-fit:contain;margin-right:18px}.gov-brand-container{display:flex;align-items:center}.ui-enhancement-section{margin-top:18px;padding:18px;border:1px solid var(--gov-border);border-radius:10px;background:#fff;box-shadow:var(--shadow-sm)}.ui-section-heading{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}.ui-section-heading h3{margin:0;color:var(--gov-navy);font-size:18px}.ui-section-heading p{margin:4px 0;color:var(--muted);font-size:12px}.ui-eyebrow{font-size:10px;letter-spacing:1px;font-weight:800;color:var(--gov-saffron)}.ui-intel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.ui-intel-card{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:14px;border:1px solid var(--gov-border-light);border-radius:8px;background:#fff;min-height:128px}.ui-intel-card h4{margin:0;color:var(--gov-navy);font-size:14px}.ui-intel-card p{margin:4px 0 10px;color:var(--muted);font-size:11px}.ui-intel-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:#f1f5f9;font-size:19px}.ui-card-action{grid-column:1/-1;justify-self:start;padding:5px 10px;font-size:11px}.ui-intel-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px;padding:10px;border-top:1px solid var(--gov-border-light)}.ui-intel-summary div{padding:7px 9px;background:#fff;border-radius:6px;border:1px solid var(--gov-border-light)}.ui-intel-summary strong{display:block;color:var(--gov-navy);font-size:18px}.ui-intel-summary span{color:var(--muted);font-size:10px}.ui-records-header{align-items:flex-start}.ui-records-summary{margin-top:2px;color:var(--muted);font-size:11px}.ui-record-search{display:flex;gap:6px}.site-footer{margin-top:24px;border-top:1px solid var(--gov-border);background:var(--gov-navy-dark);color:#e2e8f0}.site-footer-inner{max-width:1280px;margin:0 auto;padding:18px 24px;display:grid;grid-template-columns:1.4fr 1fr auto;gap:20px;align-items:center}.site-footer-brand{display:flex;align-items:center;gap:12px}.site-footer-logo{width:92px;max-height:38px;object-fit:contain}.site-footer-brand strong,.site-footer-brand span{display:block}.site-footer-brand strong{font-size:13px}.site-footer-brand span,.site-footer-meta,.site-footer-links{font-size:10px;color:#94a3b8}.site-footer-links{display:flex;flex-wrap:wrap;gap:10px}.site-footer-meta{text-align:right}@media(max-width:760px){.ui-section-heading,.ui-records-header{flex-direction:column}.ui-record-search{width:100%}.ui-record-search input{flex:1;min-width:0}.site-footer-inner{grid-template-columns:1fr}.site-footer-meta{text-align:left}.vectorflow-logo-header{width:82px;margin-right:10px}}')
          PY
      - name: Validate and publish
        run: |
          set -e
          python -m compileall -q .
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/ui-enhancements.js css/ui-enhancements.css
          git commit -m "Improve land records dashboard and records search"
          git rm .github/workflows/one-time-ui-enhancements.yml
          git commit -m "Remove one-time UI enhancement bootstrap"
          git push origin "${GITHUB_REF_NAME}"
